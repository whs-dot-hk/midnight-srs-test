[package]
name = "srs-core"
description = "SM-2 scheduling for the Midnight social SRS, plus a mirror of the on-chain verifier"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"

[[bin]]
name = "srs-plan"
path = "src/bin/srs-plan.rs"
