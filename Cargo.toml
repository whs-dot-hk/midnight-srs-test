[workspace]
members = ["crates/srs-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The scheduler is all small-integer arithmetic with explicit widths; these lints fire
# constantly on deliberate `as` narrowing that is proven safe by the range invariants.
cast_possible_truncation = "allow"
cast_lossless = "allow"
